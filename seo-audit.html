<style>

  --ground:#F3F4F7; --surface:#FFFFFF; --surface-2:#EBEEF3; --line:#DCE0E8; --line-2:#C2C8D5;
  --ink:#141822; --ink-2:#3D4553; --muted:#6A7285;
  --accent:#1D3F73; --accent-ink:#FFFFFF; --accent-soft:#E7ECF6; --accent-text:#1D3F73;
  --pass:#2E7D4F; --pass-bg:#E6F2EA;

  --warn:#8A6111; --warn-bg:#F8EFDC;
  --none:#6B7285; --none-bg:#E9ECF1;
  --serp-link:#1A0DAB; --serp-url:#4D5156;
  --shadow:0 1px 2px rgba(20,24,34,.05), 0 10px 26px -16px rgba(20,24,34,.3);
}

  --ground:#0E1117; --surface:#161A22; --surface-2:#1D222C; --line:#272D39; --line-2:#3A4250;

  --accent:#7FA8E8; --accent-ink:#0E1117; --accent-soft:#1B2637; --accent-text:#9CBDF0;
  --pass:#5FBE86; --pass-bg:#15281F;
  --fail:#E8837A; --fail-bg:#2C1A19;
  --warn:#D9A441; --warn-bg:#2A2213;
  --none:#8B93A5; --none-bg:#1F242E;
  --serp-link:#8AB4F8; --serp-url:#9AA0A6;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ground:#0E1117; --surface:#161A22; --surface-2:#1D222C; --line:#272D39; --line-2:#3A4250;
  --ink:#E9ECF2; --ink-2:#B9C1CF; --muted:#98A1B0;
  --accent:#7FA8E8; --accent-ink:#0E1117; --accent-soft:#1B2637; --accent-text:#9CBDF0;
  --pass:#5FBE86; --pass-bg:#15281F;
  --fail:#E8837A; --fail-bg:#2C1A19;
  --warn:#D9A441; --warn-bg:#2A2213;
  --none:#8B93A5; --none-bg:#1F242E;
  --serp-link:#8AB4F8; --serp-url:#9AA0A6;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.topbar{
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:15px 32px; display:flex; align-items:center; gap:14px;
}
.brand{font-family:Newsreader,Georgia,serif; font-size:21px; font-weight:600; letter-spacing:-.01em}
.brand span{color:var(--muted); font-weight:400}
.backlink{
  margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11px; text-decoration:none;
  color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:4px 11px;
}
.backlink:hover{color:var(--accent-text); border-color:var(--accent)}

.wrap{max-width:1000px; margin:0 auto; padding:30px 32px 90px}

/* 1 — picker */
.picker{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 22px; box-shadow:var(--shadow)}
.picker > h2{
  margin:0 0 14px; font-size:11px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted);
}
.combo{position:relative}
.comboBtn{
  font:inherit; width:100%; cursor:pointer; text-align:left; display:flex; align-items:center; gap:12px;
  padding:13px 16px; border-radius:10px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
}
.comboBtn:hover{border-color:var(--accent)}
.comboBtn .term{font-size:18px; font-weight:600; letter-spacing:-.01em}
.comboBtn .vol{
  font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;
  margin-left:auto; white-space:nowrap;
}
.comboBtn .chev{color:var(--muted); font-size:11px}
.comboPanel{
  position:absolute; z-index:30; top:calc(100% + 6px); left:0; right:0;
  background:var(--surface); border:1px solid var(--line-2); border-radius:10px;
  box-shadow:var(--shadow); overflow:hidden;
}
.comboPanel input{
  font:inherit; font-size:14px; width:100%; padding:12px 16px; border:0; border-bottom:1px solid var(--line);
  background:var(--surface); color:var(--ink);
}
.comboPanel input:focus{outline:none; background:var(--accent-soft)}
.comboPanel ul{list-style:none; margin:0; padding:6px; max-height:330px; overflow-y:auto}
.comboPanel li{
  display:flex; align-items:baseline; gap:12px; padding:9px 11px; border-radius:7px;
  font-size:14px; color:var(--ink-2); cursor:pointer;
}
.comboPanel li em{
  font-style:normal; margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  color:var(--muted); font-variant-numeric:tabular-nums;
}
.comboPanel li:hover,.comboPanel li.active{background:var(--surface-2)}
.comboPanel li[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); font-weight:600}
.comboPanel li[aria-selected="true"] em{color:var(--accent-ink); opacity:.8}
.comboPanel .none{padding:14px 16px; font-size:13px; color:var(--muted); font-style:italic}
.siblings{margin-top:18px; padding-top:15px; border-top:1px solid var(--line)}
.siblings .lead{font-size:12.5px; color:var(--muted); margin:0 0 10px}
.siblings .lead b{color:var(--ink-2); font-weight:600}
.sibchips{display:flex; flex-wrap:wrap; gap:7px}
.sibchip{
  font:inherit; font-size:12.5px; cursor:pointer; padding:5px 11px; border-radius:99px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  display:inline-flex; align-items:baseline; gap:7px;
}
.sibchip:hover{border-color:var(--accent); color:var(--accent-text)}
.sibchip em{font-style:normal; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.cannib{
  margin:12px 0 0; font-size:12.5px; color:var(--warn); background:var(--warn-bg);
  border:1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius:8px; padding:9px 12px; max-width:72ch;
}
.absent{
  margin:0 0 18px; font-size:13.5px; color:var(--ink-2); background:var(--warn-bg);
  border:1px solid var(--warn); border-radius:10px; padding:13px 16px; max-width:78ch;
}
.absent b{color:var(--ink)}
.score .reach{font-size:12.5px; color:var(--muted); width:100%; margin-top:2px}
.score .reach b{color:var(--ink-2); font-weight:600; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
td.cov{text-align:center; font-family:"IBM Plex Mono",monospace; font-size:13px}
td.cov.yes{color:var(--pass)} td.cov.no{color:var(--line-2)}
th.cov{text-align:center}
tr.self td{background:var(--accent-soft)}
tr.self td:first-child{font-weight:600; color:var(--ink)}
.sitestrip{
  display:flex; flex-wrap:wrap; gap:6px 22px; margin-top:18px; padding-top:15px;
  border-top:1px solid var(--line); font-size:12.5px; color:var(--muted);
}
.sitestrip b{font-family:"IBM Plex Mono",monospace; font-weight:500; color:var(--ink-2); font-variant-numeric:tabular-nums}

/* headings */
section{margin-top:38px}
.shead{display:flex; align-items:baseline; gap:14px; margin:0 0 13px}
.shead h3{
  margin:0; font-family:Newsreader,Georgia,serif; font-size:22px; font-weight:500;
  letter-spacing:-.01em; color:var(--ink);
}
.shead .note{font-size:12px; color:var(--muted); margin-left:auto; text-align:right; max-width:46ch; line-height:1.4}

/* 2 — score */
.score{
  display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 24px;
}
.score .n{font-family:"IBM Plex Mono",monospace; font-size:38px; font-weight:500; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.03em}
.score .n small{font-size:15px; color:var(--muted); font-weight:400}
.dots{display:flex; gap:5px}
.dot{width:11px; height:11px; border-radius:3px; background:var(--none); opacity:.4}
.dot.pass{background:var(--pass); opacity:1} .dot.fail{background:var(--fail); opacity:1}
.score .say{font-size:14px; color:var(--ink-2); margin-left:auto; text-align:right; max-width:34ch}

/* 4 — google */
.gcard{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 24px; box-shadow:var(--shadow)}
.gcard .u{font-family:Arial,Helvetica,sans-serif; font-size:12.5px; color:var(--serp-url); margin-bottom:4px; word-break:break-all}
.gcard .t{font-family:Arial,Helvetica,sans-serif; font-size:20px; line-height:1.3; color:var(--serp-link); margin-bottom:5px}
.gcard .d{font-family:Arial,Helvetica,sans-serif; font-size:14px; line-height:1.58; color:var(--ink-2); max-width:62ch}
.gcard .d .over{color:var(--fail); text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--fail) 50%,transparent)}
.gcard .none{font-style:italic; color:var(--muted)}
.gnote{margin:14px 0 0; padding-top:13px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); max-width:70ch}
.gnote b{color:var(--ink-2); font-weight:600}

/* tables */
.tbl{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:660px; font-size:13.5px}
th{
  text-align:left; font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface-2);
}
td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:none}
.c-tag{font-weight:600; white-space:nowrap; color:var(--ink)}
.c-val{min-width:160px; width:30%}
.c-len{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap; width:82px}
.c-val .tx{color:var(--ink-2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.c-val .tx.none{font-style:italic; color:var(--muted)}
.c-target{font-size:12px; color:var(--muted); line-height:1.35; width:120px}
.c-fix{font-size:12.5px; color:var(--ink-2); width:22%}
.c-fix.ok{color:var(--muted)}
td.mono{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.pill{display:inline-block; font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:5px; white-space:nowrap}
.pill.pass{background:var(--pass-bg); color:var(--pass)}
.pill.fail{background:var(--fail-bg); color:var(--fail)}
.pill.weak{background:var(--warn-bg); color:var(--warn)}
.pill.missing{background:var(--none-bg); color:var(--none)}
.pill.na{background:var(--none-bg); color:var(--none)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:11.5px; padding:2px 9px; border-radius:99px; border:1px solid var(--line-2); color:var(--ink-2)}
.chip.on{border-color:var(--pass); color:var(--pass); background:var(--pass-bg)}

/* 7 — fixes */
.fixes{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.fixes li{
  display:grid; grid-template-columns:26px minmax(0,1fr); gap:12px; align-items:start;
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px;
  font-size:14px; line-height:1.5; color:var(--ink-2);
}
.fixes .rank{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--accent-text); font-weight:500; padding-top:2px}
details.more{margin-top:14px}
details.more summary{
  cursor:pointer; font-size:12.5px; color:var(--muted); list-style:none; display:inline-flex; gap:7px; align-items:center;
  border:1px solid var(--line); border-radius:99px; padding:6px 14px; background:var(--surface);
}
details.more summary::-webkit-details-marker{display:none}
details.more summary:hover{color:var(--accent-text); border-color:var(--accent)}
details.more[open] summary{margin-bottom:14px}
.morebox{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:24px}
.morebox h4{margin:0 0 10px; font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.morebox ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:7px; font-size:13px; color:var(--ink-2); line-height:1.5}

/* gap */
.gap{background:var(--warn-bg); border:1px solid var(--warn); border-radius:12px; padding:22px 24px}
.gap h3{margin:0 0 8px; font-family:Newsreader,Georgia,serif; font-size:22px; font-weight:500; color:var(--ink)}
.gap p{margin:0 0 14px; font-size:14px; color:var(--ink-2); max-width:66ch}
.gap .rec{font-family:"IBM Plex Mono",monospace; font-size:13px; background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:9px 13px; display:inline-block; word-break:break-all}

@media (max-width:720px){
  .wrap{padding:22px 16px 70px}
  .topbar{padding:13px 16px}
  .shead{flex-direction:column; gap:5px}
  .shead .note{margin-left:0; text-align:left}
  .score .say{margin-left:0; text-align:left}
}
</style>

  if (!obj || obj.status === "pass") return ["—", true];
  const [lo, hi] = RANGES[key];
  const head = (page.keywords || []).slice().sort((a, b) => b.search_volume - a.search_volume)[0];
  const headTerm = head ? head.term : "";
  if (!obj.text) return [`Write one, ${lo}–${hi} chars, using “${headTerm}”`, false];
  const bits = [];
  if (obj.length < lo) bits.push(`extend to ${lo}–${hi} chars`);
  else if (obj.length > hi) bits.push(`trim to ${lo}–${hi} chars`);
  const missing = (page.keywords || []).filter(k => !(obj.matched_keywords || []).includes(k.term));
  if (missing.length === (page.keywords || []).length) bits.push(`add “${headTerm}”`);
  else if (missing.length) bits.push(`covers ${(page.keywords || []).length - missing.length} of ${(page.keywords || []).length} keywords`);
  return [bits.length ? bits.join(" · ") : "align with the rule", false];
}
/* "hy" and "hud" are the same word to a searcher — used to spot two pages chasing one query */
const normalise = t => t.toLowerCase().replace(/\bhy\b/g, "hud").replace(/\bför\b/g, "").replace(/\s+/g, " ").trim();
const clash = {};
index.forEach(k => (clash[normalise(k.term)] = clash[normalise(k.term)] || []).push(k));

function clip(text, limit) {
  const t = String(text || "");
  return t.length <= limit ? esc(t) : esc(t.slice(0, limit)) + `<span class="over">${esc(t.slice(limit))}</span>`;
}

function render() {
  const entry = index.find(k => k.term === current), p = entry.page;
  document.getElementById("kwTerm").textContent = entry.term;
  document.getElementById("kwVol").textContent = num(entry.volume) + " searches / mo";

  const family = p.keywords || [], reach = family.reduce((n, k) => n + k.search_volume, 0);
  const sibs = family.filter(k => k.term !== current);
  const rival = (clash[normalise(entry.term)] || []).find(k => k.term !== entry.term && k.page !== p);
  document.getElementById("siblings").innerHTML = `
    <p class="lead">${p.url
      ? `The same page answers <b>${family.length} keywords</b> worth <b>${num(reach)} searches a month</b>. Fix it once, all of them move.`
      : `This gap covers <b>${family.length} keywords</b> worth <b>${num(reach)} searches a month</b>.`}</p>
    ${sibs.length ? `<div class="sibchips">${sibs.map(k =>
      `<button class="sibchip" data-term="${esc(k.term)}">${esc(k.term)}<em>${num(k.search_volume)}</em></button>`).join("")}</div>` : ""}
    ${rival ? `<p class="cannib">“${esc(rival.term)}” (${num(rival.volume)}/mo) is the same query in different words, but it is mapped to another page. Two pages chasing one search compete with each other — decide which one owns it.</p>` : ""}`;

  /* content gap */
  if (!p.url) {
    document.getElementById("main").innerHTML = `
      <section><div class="gap">
        <h3>No page targets “${esc(entry.term)}”</h3>
        <p>${esc(num(entry.volume))} searches a month with nothing on the site to answer them. Nothing to audit until a page exists.</p>
        <p style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Build this</p>
        <div class="rec">${esc(p.recommended_url)}</div>
      </div></section>
      <section>
        <div class="shead"><h3>Fix these</h3></div>
        <ul class="fixes">${(p.recommendations || []).slice(0, 3).map((r, i) =>
          `<li><span class="rank">${i + 1}</span><span>${esc(r)}</span></li>`).join("")}</ul>
        ${moreBlock(p, 3)}
      </section>`;
    window.scrollTo({ top: 0, behavior: "instant" });
    return;
  }

  const keys = Object.keys(RANGES).filter(k => p[k]);
  const stats = keys.map(k => p[k].status);
  const passes = stats.filter(x => x === "pass").length;
  const alts = p.img_alts || [], altSet = alts.filter(a => a.alt_text).length;
  const headTerm = (family.slice().sort((a, b) => b.search_volume - a.search_volume)[0] || {}).term || entry.term;
  const urlParts = p.url.replace("https://", "").split("/");

  let html = "";

  /* 2 — score */
  html += `<section>
    <div class="shead"><h3>Page score</h3><span class="note">One score for the page, shared by all ${family.length} keywords on it.</span></div>
    <div class="score">
      <div class="n">${passes}<small> / ${stats.length}</small></div>
      <div class="dots">${stats.map(x => `<span class="dot ${x}" title="${esc(x)}"></span>`).join("")}</div>
      <div class="say">${passes === stats.length ? "Every tag passes." :
        `${stats.length - passes} of ${stats.length} tags need work on <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(urlParts.slice(1).join("/"))}</a>`}</div>
      <div class="reach">Fixing this page affects <b>${family.length}</b> keywords and <b>${num(reach)}</b> searches a month.</div>
    </div>
  </section>`;

  /* selected keyword nowhere on the page */
  const covFields = ["title", "description", "h1", "h2"];
  const seen = f => ((p[f] || {}).matched_keywords || []).includes(entry.term);
  if (!covFields.some(seen)) {
    html += `<p class="absent"><b>“${esc(entry.term)}” appears in none of this page’s tags.</b> The page is mapped here as the best home for it, but nothing on it currently targets the phrase.</p>`;
  }

  /* coverage matrix */
  html += `<section>
    <div class="shead"><h3>Keyword coverage</h3><span class="note">Which of the page’s keywords actually appear in each tag.</span></div>
    <div class="tbl"><table>
      <thead><tr><th>Keyword</th><th>Volume</th>
        ${covFields.map(f => `<th class="cov">${esc(LABELS[f].replace(" heading", "").replace("First ", ""))}</th>`).join("")}</tr></thead>
      <tbody>${family.slice().sort((a, b) => b.search_volume - a.search_volume).map(k => `<tr class="${k.term === current ? "self" : ""}">
        <td>${esc(k.term)}</td>
        <td class="mono">${num(k.search_volume)}</td>
        ${covFields.map(f => {
          const hit = ((p[f] || {}).matched_keywords || []).includes(k.term);
          return `<td class="cov ${hit ? "yes" : "no"}">${hit ? "&check;" : "&middot;"}</td>`;
        }).join("")}
      </tr>`).join("")}</tbody>
    </table></div>
  </section>`;

  /* 4 — google */
  html += `<section>
    <div class="shead"><h3>How this page looks in Google</h3></div>
    <div class="gcard">
      <div class="u">${esc(urlParts.slice(0, 4).join(" › "))}</div>
      <div class="t">${p.title.text ? esc(p.title.text) : "—"}</div>
      <div class="d">${p.description.text ? clip(p.description.text, CLIP)
        : `<span class="none">No description written — Google will pick its own text from the page.</span>`}</div>
      <p class="gnote"><b>This is the SERP listing</b> — what a customer sees before they click. Google cuts the grey text at roughly ${CLIP} characters; anything struck through never gets read.</p>
    </div>
  </section>`;

  /* 5 — tags */
  html += `<section>
    <div class="shead"><h3>Tag check</h3><span class="note">The text Google and social platforms read. Each has a length window and should contain the keyword.</span></div>
    <div class="tbl"><table>
      <thead><tr><th>Tag</th><th>Value</th><th>Length</th><th>Target</th><th>Status</th><th>Fix</th></tr></thead>
      <tbody>${keys.map(k => {
        const o = p[k], [lo, hi] = RANGES[k], [fix, ok] = fixFor(k, o, p);
        return `<tr>
          <td class="c-tag">${esc(LABELS[k])}</td>
          <td class="c-val"><span class="tx ${o.text ? "" : "none"}">${o.text ? esc(o.text) : "not set"}</span></td>
          <td class="c-len">${o.text ? o.length + " chars" : "—"}</td>
          <td class="c-target">${lo}–${hi} chars<br>must contain keyword</td>
          <td><span class="pill ${esc(o.status)}">${esc(o.status)}</span></td>
          <td class="c-fix ${ok ? "ok" : ""}">${fix === "—" ? "—" : esc(fix)}</td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>
  </section>`;

  /* 6 — images */
  html += `<section>
    <div class="shead"><h3>Images</h3><span class="note">Alt text is what Google and screen readers see instead of the picture.</span></div>
    <div class="tbl"><table>
      <thead><tr><th>#</th><th>File</th><th>Alt text</th><th>Status</th><th>Fix</th></tr></thead>
      <tbody>${alts.map(a => `<tr>
        <td class="mono">${a.img_id}</td>
        <td class="mono" title="${esc(a.img_url)}">${esc(String(a.img_url).split("/").pop())}</td>
        <td class="c-val"><span class="tx ${a.alt_text ? "" : "none"}">${a.alt_text ? esc(a.alt_text) : "empty"}</span></td>
        <td><span class="pill ${esc(a.status)}">${esc(a.status)}</span></td>
        <td class="c-fix">${a.alt_text ? `Rewrite in Swedish with “${esc(headTerm)}”` : `Add Swedish alt with “${esc(headTerm)}”`}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <p style="margin:10px 2px 0;font-size:12.5px;color:var(--muted)">${altSet} of ${alts.length} images have alt text.</p>
  </section>`;

  /* 8 — tech */
  const mp = (p.page_speed || {}).measured_proxies || {};
  const errs = [["404s", p["404_errors"]], ["broken links", p.broken_links], ["redirects", p.redirects],
                ["duplicate content", p.duplicate_content], ["schema errors", p.structured_data_errors]];
  const bad = errs.filter(([, v]) => v);
  const techRows = [
    ["Structured data", (p.list_of_schema_markups || []).length
      ? `<div class="chips">${p.list_of_schema_markups.map(x => `<span class="chip on">${esc(x.schema_type)}</span>`).join("")}</div>`
      : `<span class="tx none">none</span>`,
      (p.list_of_schema_markups || []).length ? "pass" : "missing"],
    ["Mobile", p.mobile_friendly ? "Usable on mobile" : "Not mobile friendly", p.mobile_friendly ? "pass" : "fail"],
    ["Page speed", "Not measured — Google's API refused the request", "na"],
    ["Server response", `${mp.ttfb_seconds}s to first byte · ${Math.round(mp.html_bytes / 1024)} KB of HTML`, mp.ttfb_seconds < 0.8 ? "pass" : "weak"],
    ["Render-blocking", `${mp.render_blocking_head_stylesheets} stylesheets · ${mp.render_blocking_head_scripts} scripts`, "weak"],
    ["Images", `${mp.images_on_page} on page · ${mp.images_lazy_loaded} lazy-loaded`, "pass"],
    ["Canonical", p.canonical_self_referencing ? "Points at itself, correct" : "Not self-referencing", p.canonical_self_referencing ? "pass" : "fail"],
    ["Languages", `${p.hreflang_tags} hreflang tags`, "pass"],
    ["Errors", bad.length ? `Found: ${bad.map(([k]) => k).join(", ")}` : "None found", bad.length ? "fail" : "pass"]
  ];
  html += `<section>
    <div class="shead"><h3>Tech</h3><span class="note">Everything that isn't words on the page.</span></div>
    <div class="tbl"><table>
      <thead><tr><th>Check</th><th>Value</th><th>Status</th></tr></thead>
      <tbody>${techRows.map(([k, v, st]) => `<tr>
        <td class="c-tag">${esc(k)}</td><td class="c-val">${v}</td>
        <td><span class="pill ${st}">${st === "na" ? "n/a" : st}</span></td>
      </tr>`).join("")}</tbody>
    </table></div>
  </section>`;

  /* 7 — fixes */
  html += `<section>
    <div class="shead"><h3>Fix these</h3><span class="note">Ordered by what moves the needle first.</span></div>
    <ul class="fixes">${(p.recommendations || []).slice(0, 3).map((r, i) =>
      `<li><span class="rank">${i + 1}</span><span>${esc(r)}</span></li>`).join("")}</ul>
    ${moreBlock(p, 3)}
  </section>`;

  document.getElementById("main").innerHTML = html;
  window.scrollTo({ top: 0, behavior: "instant" });
}

function moreBlock(p, shown) {
  const rest = (p.recommendations || []).slice(shown), issues = p.issues || [];
  if (!rest.length && !issues.length) return "";
  return `<details class="more">
    <summary>Show all ${issues.length} issues and ${rest.length} more fixes</summary>
    <div class="morebox">
      ${issues.length ? `<div><h4>Issues found</h4><ul>${issues.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>` : ""}
      ${rest.length ? `<div><h4>Remaining fixes</h4><ul>${rest.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>` : ""}
    </div>
  </details>`;
}

document.getElementById("siblings").addEventListener("click", e => {
  const t = e.target.closest("[data-term]");
  if (!t) return;
  current = t.dataset.term; render();
});
list.addEventListener("click", e => {
  const t = e.target.closest("[data-term]");
  if (!t) return;
  current = t.dataset.term; closePanel(); render();
});
if (["localhost", "127.0.0.1"].includes(location.hostname)) document.getElementById("backLink").hidden = false;
render();
</script>
